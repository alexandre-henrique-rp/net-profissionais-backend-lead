name: net-profissionais-backend-lead

x-api: &api
  image: net-profissionais-backend-lead:${RELEASE_TAG:-local}
  env_file:
    - .env.prod
  environment:
    NODE_ENV: production
    PORT: "3000"
  expose:
    - "3000"
  restart: unless-stopped
  stop_grace_period: 40s
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
    interval: 5s
    timeout: 3s
    start_period: 15s
    retries: 12
  networks:
    - api

services:
  api-blue:
    <<: *api
    build:
      context: .
      target: runtime

  api-green:
    <<: *api
    build:
      context: .
      target: runtime

  api-migrate:
    image: net-profissionais-backend-lead-migrate:${RELEASE_TAG:-local}
    build:
      context: .
      target: migrate
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
    profiles:
      - migration

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "3000:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.deploy:/etc/nginx/deploy:ro
    restart: unless-stopped
    networks:
      - api

networks:
  api:
    driver: bridge
