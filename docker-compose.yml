name: net-profissionais-backend-lead

# Container único na porta 3000: o Cloudflare Tunnel encaminha o tráfego
# público direto para a porta 3000 do host — não há proxy interno nem
# alternância de slots. Cada deploy recria o serviço `api` (a API fica
# alguns segundos fora enquanto o container novo sobe e passa no
# healthcheck). O rollback sobe a imagem tagueada da release anterior,
# sem rebuild — ver deploy.sh.
services:
  api:
    image: net-profissionais-backend-lead:${RELEASE_TAG:-local}
    build:
      context: .
      target: runtime
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: "3000"
    expose:
      - "3000"
    # Permite que DATABASE_URL/REDIS_URL apontem para o host onde Postgres e
    # Redis rodam como serviços do sistema: use host.docker.internal no .env.prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stop_grace_period: 40s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 12
    ports:
      - "3000:3000"
    networks:
      - api

  api-migrate:
    image: net-profissionais-backend-lead-migrate:${RELEASE_TAG:-local}
    build:
      context: .
      target: migrate
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - migration

networks:
  api:
    driver: bridge
