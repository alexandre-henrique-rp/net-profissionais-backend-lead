# Exemplo de site para o Nginx DO SERVIDOR (não roda em container).
#
# 1) Copie este bloco para /etc/nginx/sites-available/ (ou conf.d/) e ajuste:
#      - server_name
#      - o caminho absoluto do include abaixo (aponta para o upstream que o
#        deploy.sh reescreve a cada atualização blue-green)
# 2) Habilite o site e rode: nginx -t && nginx -s reload
# 3) Se o usuário do deploy não puder recarregar o Nginx, exporte no shell do
#    deploy: NGINX_RELOAD_CMD="sudo systemctl reload nginx"

map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}

# Ajuste para o caminho absoluto real deste repositório no servidor:
include /opt/net-profissionais-backend-lead/.deploy/upstream.conf;

server {
	listen 80;
	server_name api.seudominio.com.br;

	client_max_body_size 10m;

	location / {
		proxy_pass http://netprofissional_api;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_read_timeout 75s;
	}
}
